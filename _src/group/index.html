<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection — Research Artifacts</title>
<link rel="icon" href="/pages/shared/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/pages/shared/paper.css" />
<link rel="stylesheet" href="/pages/shared/menu.css" />
</head>
<body class="paper">

<div id="password-gate">
  <div class="gate-box">
    <div style="font-size:40px;margin-bottom:16px;">🔐</div>
    <h1>Password Required</h1>
    <p>Enter the passcode to view</p>
    <input type="password" id="password-input" placeholder="passcode" autocomplete="off" />
    <div class="error" id="password-error">Incorrect password</div>
  </div>
</div>

<main class="sheet catalogue">

<!-- Hero and body are both filled from the encrypted manifest: one page serves
     every collection, selected by ?g=<group-slug>. Adding a collection is a
     manifest edit, not a new template. -->
<header class="hero" id="group-hero">
  <h1 id="group-title">Collection</h1>
  <p class="lede" id="group-lede">Loading…</p>
</header>

<div id="group-body"></div>

<footer class="sheet-footer">
  Encrypted at rest · password recon2026<br />
  Sources live in _src/ — the published root is generated by build.py
</footer>

</main>

<script>
(function(){
  const HASH = "2ff51fba4b8b1137a97ed27dfbd357e5b690665b2f016c308d95b05febf5bf7e";
  const BASE = '/pages/';
  const gate = document.getElementById('password-gate');
  const input = document.getElementById('password-input');
  const error = document.getElementById('password-error');

  const wanted = new URLSearchParams(window.location.search).get('g');

  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function unlock(digest) {
    gate.classList.add('hidden');
    localStorage.setItem('pages_pass', digest);
    render();
  }

  async function check() {
    const digest = await sha256(input.value);
    if (digest === HASH) {
      unlock(digest);
    } else {
      error.style.display = 'block';
      setTimeout(() => error.style.display = 'none', 2000);
    }
  }

  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });

  if (localStorage.getItem('pages_pass') === HASH) unlock(HASH);

  // ─── Rendering ─────────────────────────────────────────────────────────

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  function plural(n, word) {
    return n + ' ' + word + (n === 1 ? '' : 's');
  }

  function section(label, inner) {
    return '<section class="cat-section">'
      + '<p class="cat-section-label">' + esc(label) + '</p>'
      + inner + '</section>';
  }

  function artifactCard(p) {
    return '<a class="cat-card" href="' + BASE + esc(p.slug) + '/">'
      + '<p class="cat-emoji">' + esc(p.emoji || '📄') + '</p>'
      + (p.kicker ? '<p class="cat-kicker">' + esc(p.kicker) + '</p>' : '')
      + '<p class="cat-name">' + esc(p.title) + '</p>'
      + '<p class="cat-desc">' + esc(p.description) + '</p>'
      + '<p class="cat-go">Read →</p>'
      + '</a>';
  }

  function groupRow(g, count) {
    return '<a class="cat-row" href="' + BASE + 'group/?g=' + encodeURIComponent(g.slug) + '">'
      + '<span class="cat-row-emoji">' + esc(g.emoji || '📁') + '</span>'
      + '<span class="cat-row-name">' + esc(g.title) + '</span>'
      + '<span class="cat-row-group">' + plural(count, 'artifact') + '</span>'
      + '</a>';
  }

  function setHero(title, lede) {
    document.getElementById('group-title').textContent = title;
    document.getElementById('group-lede').textContent = lede;
    document.title = title + ' — Research Artifacts';
  }

  function build(data) {
    const groups = data.groups || [];
    const pages = data.pages || [];
    const membersOf = slug => pages
      .filter(p => p.group === slug)
      .sort((a, b) => (a.order || 99) - (b.order || 99));

    const group = groups.find(g => g.slug === wanted);
    const body = document.getElementById('group-body');

    // No ?g=, or a slug that no longer exists — fall back to the collection list
    // rather than a dead end.
    if (!group) {
      setHero('Collections',
        wanted ? 'No collection named “' + wanted + '”. Here is everything on offer.'
               : 'Pick a collection to see what is inside.');
      body.innerHTML = section(plural(groups.length, 'collection'),
        '<div class="cat-list">'
        + groups.map(g => groupRow(g, membersOf(g.slug).length)).join('')
        + '</div>');
      return;
    }

    setHero(group.title, group.description);

    const members = membersOf(group.slug);
    let html = section(plural(members.length, 'artifact'),
      '<div class="cat-grid">' + members.map(artifactCard).join('') + '</div>');

    const others = groups.filter(g => g.slug !== group.slug);
    if (others.length) {
      html += section('Other collections',
        '<div class="cat-list">'
        + others.map(g => groupRow(g, membersOf(g.slug).length)).join('')
        + '</div>');
    }

    body.innerHTML = html;
  }

  async function render() {
    try {
      const res = await fetch(BASE + 'manifest.enc');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const enc = await res.text();

      const pw = window.PagesCrypto && window.PagesCrypto.getStoredPassword();
      if (!pw) throw new Error('locked');
      const json = await window.PagesCrypto.decrypt(enc, pw);
      if (!json) throw new Error('decrypt failed');

      build(JSON.parse(json));
    } catch (e) {
      setHero('Collection', 'Could not load this collection.');
      document.getElementById('group-body').innerHTML =
        '<div class="note warn"><strong>Could not load the catalogue.</strong> '
        + 'The manifest failed to decrypt — try reloading, or clear the stored password and re-enter it.</div>';
    }
  }
})();
</script>
<script src="/pages/shared/paper.js"></script>
<script src="/pages/shared/menu.js"></script>

</body>
</html>
