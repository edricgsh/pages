  const gate = document.getElementById('password-gate');
  const input = document.getElementById('password-input');
  const error = document.getElementById('password-error');
  const content = document.getElementById('protected-content');

  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function deriveKey(pwd, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd),
      { name: 'PBKDF2' }, false, ['deriveBits', 'deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decryptContent(pwd) {
    try {
      const raw = Uint8Array.from(atob(ENCRYPTED_PAYLOAD), c => c.charCodeAt(0));
      const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      const key = await deriveKey(pwd, salt);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return new TextDecoder().decode(dec);
    } catch(e) { return null; }
  }

  (async function() {
    const stored = localStorage.getItem('pages_pass');
    if (stored === PASSWORD_HASH) {
      const d = await decryptContent(PASSWORD_HASH);
      if (d) { content.innerHTML = d; if(gate) gate.classList.add('hidden'); return; }
    }
  })();

  window.checkPassword = async function() {
    const pwd = input ? input.value : '';
    const digest = await sha256(pwd);
    if (digest !== PASSWORD_HASH) {
      if (error) { error.style.display = 'block'; setTimeout(() => error.style.display = 'none', 2000); }
      return;
    }
    const d = await decryptContent(pwd);
    if (d) {
      content.innerHTML = d;
      if (gate) gate.classList.add('hidden');
      localStorage.setItem('pages_pass', digest);
      if (window.onContentDecrypted) window.onContentDecrypted();
    }
  };
  if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') window.checkPassword(); });
})();
