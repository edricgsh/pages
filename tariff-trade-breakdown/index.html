<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#25253a;--text:#e4e4ed;--text-muted:#8888a0;--accent-blue:#60a5fa;--accent-amber:#f59e0b;--accent-purple:#a855f7;--accent-green:#10b981;--accent-orange:#f97316;--accent-red:#ef4444;--accent-gold:#fbbf24}

.pw-gate form{display:flex;gap:.75rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.5rem;padding-left:1rem}
.pw-gate input{background:transparent;border:none;outline:none;color:var(--text);font-size:1rem;width:220px;font-family:'JetBrains Mono',monospace}
.pw-gate input::placeholder{color:#555}
.pw-gate button{background:var(--accent-purple);color:#fff;border:none;padding:.6rem 1.4rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;transition:background .2s}
.pw-gate button:hover{background:#7c3aed}

const rawNodes = [
  { id:'n1',  cat:'mechanics',  title:'What Is a Tariff?',            summary:'A tax on imported goods paid by the importer but ultimately borne by consumers.',                          detail:'A tariff is a tax levied by a government on goods imported from another country. While importers pay the tax at the border, the cost is usually passed on to consumers through higher prices. Tariffs are one of the oldest trade policy tools, used both for revenue and for protecting domestic industries from foreign competition.' },
  { id:'n2',  cat:'mechanics',  title:'Milk Tea Example',             summary:'20% tariff: $100 item to $120 for consumer, $20 goes to government revenue.',                               detail:'Consider Milk Tea Kingdom, which imposes a 20% tariff on imported milk tea. A product originally priced at $100 now incurs a $20 tariff, pushing the consumer price to $120. The government collects $20 in revenue.' },
  { id:'n3',  cat:'mechanics',  title:'Winners of Tariffs',           summary:'Government (revenue) and domestic producers (less competition, higher prices, more jobs).',                   detail:'Tariffs produce clear winners: (1) Government collects revenue directly from every imported unit. (2) Domestic producers face less foreign competition, allowing them to raise prices, expand production, and hire more workers.' },
  { id:'n4',  cat:'mechanics',  title:'Losers of Tariffs',            summary:'Consumers pay 34% more. Downstream industries suffer -- steel tariffs cost Ford $1B+.',                       detail:'Tariffs hurt two key groups: (1) Consumers pay higher prices. (2) Downstream industries that use imported inputs face cost increases. The auto industry employs far more workers than steel.' },
  { id:'n5',  cat:'mechanics',  title:'Deadweight Loss',              summary:'Classical economics: tariffs always create a net welfare loss for society.',                                detail:'In classical economics, tariffs generate deadweight loss -- a net destruction of value. Even though government gains revenue and domestic producers gain market share, the losses to consumers exceed those gains.' },
  { id:'n6',  cat:'mechanics',  title:'Why Tariffs Still Exist',      summary:'Infant industry protection, negotiation leverage, political appeal, strategic rivalry.',                      detail:'Despite the deadweight loss argument, tariffs persist for: infant industry protection, negotiation leverage in trade deals, political appeal to voters, and national security concerns.' },
  { id:'n7',  cat:'mechanics',  title:'Infant Industry Success',      summary:'Hamilton tariffs >40% -> steel 500x. China car tariffs >200%.',                                              detail:'Alexander Hamilton championed protective tariffs. US tariffs >40% in the 1800s grew steel output 500-fold. China applies the same playbook with car tariffs >200%.' },
  { id:'n8',  cat:'mechanics',  title:'The Chicken-Truck War',        summary:'1963: tit-for-tat tariff spiral between US and Europe.',                                                    detail:'In 1963, US tariffs on European chicken led to European retaliation on American trucks. The 25% "chicken tax" on light trucks remains to this day.' },
  { id:'n9',  cat:'economics',  title:'Prisoner Dilemma',             summary:'Two countries choose Open (free trade) or Protect (tariffs).',                                              detail:'Trade policy is a Prisoner Dilemma. Each country chooses cooperate (open) or defect (tariffs). The incentive structure pushes rational actors toward a collectively bad outcome.' },
  { id:'n10', cat:'economics',  title:'The Payoff Matrix',            summary:'Both open=+3/+3. One protects=+8/-5. Both protect=-3/-3.',                                                  detail:'If both cooperate, each gains +3. If A protects while B stays open, A gains +8 while B loses -5. If both protect, both lose -3.' },
  { id:'n11', cat:'economics',  title:'Nash Equilibrium',             summary:'Rational self-interest leads both to protect -> mutual loss.',                                              detail:'The Nash Equilibrium is (Protect, Protect). Neither can unilaterally improve by switching. This is why without institutions, the default is protectionism.' },
  { id:'n12', cat:'economics',  title:'Tit-for-Tat',                  summary:'In repeated games, cooperate first then mirror opponent move.',                                            detail:'When trade is repeated, tit-for-tat works: cooperate first, then mirror the opponent last move. Fear of retaliation deters defection.' },
  { id:'n13', cat:'economics',  title:'WTO and Institutions',          summary:'166 members, 98% of world trade. EU, USMCA provide trust.',                                                detail:'Institutions provide trust and enforcement. The WTO establishes rules and adjudicates disputes. Regional blocs like the EU eliminate the defect option entirely.' },
  { id:'n14', cat:'history',    title:'Mercantilism (1700s)',         summary:'Britain avg tariff ~50%. Colonies served the mother country.',                                             detail:'In the mercantilist era, trade was zero-sum. Britain averaged ~50% tariffs. Adam Smith attacked this system in 1776.' },
  { id:'n15', cat:'history',    title:'Comparative Advantage (1817)', summary:'Ricardo: specialize in what you do best, trade for the rest.',                                            detail:'David Ricardo showed that even if one country is better at everything, both benefit from trade by specializing.' },
  { id:'n16', cat:'history',    title:'US and Germany Industrialize',  summary:'1800s: ignored free trade. Tariffs >40%. Steel 500x. US overtakes Britain.',                                detail:'The US and Germany rejected free trade advice. Friedrich List argued Britain was "kicking away the ladder." US tariffs >40% fueled industrial dominance.' },
  { id:'n17', cat:'history',    title:'Smoot-Hawley (1930)',          summary:'20-60% tariffs on 20K+ goods. Trade collapsed 66%. Deepened Depression.',                                     detail:'Smoot-Hawley raised tariffs to 20-60% on 20,000+ goods. Retaliation followed. Global trade fell 66%. The canonical example of protectionism failure.' },

  { id:'n22', cat:'economics',  title:'The Triffin Dilemma',          summary:'Reserve-currency issuer MUST run deficits to supply the world.',                                          detail:'Robert Triffin predicted this in the 1960s. To supply dollars globally, the US must run deficits. It is structural, not a policy failure.' },
  { id:'n23', cat:'economics',  title:'Healthy vs Unhealthy',         summary:'Australia=healthy. Greece pre-2010=unhealthy. Sri Lanka=collapse.',                                        detail:'Not all deficits are equal. Australia uses foreign capital for productive investment. Greece used it for consumption bubbles. Sri Lanka borrowed beyond its means and collapsed.' },
  { id:'n24', cat:'strategy',   title:'The Milan Framework',          summary:'7-goal framework. Economic growth no longer #1. Radical departure.',                                       detail:'Core goals: Govt Finances, Manufacturing Reshoring, Restrict China. Compromise: Economic Growth, Price Stability. Sacrificeable: Dollar Hegemony.' },
  { id:'n25', cat:'strategy',   title:'Mar-a-Lago Accord',            summary:'Devalue USD with allies. Roll Treasuries into 50-100yr bonds.',                                           detail:'A negotiated agreement with allies to jointly devalue the USD, similar to 1985 Plaza Accord. Includes restructuring debt into ultra-long bonds.' },
  { id:'n26', cat:'strategy',   title:'Unilateral Strategy',          summary:'Charge foreigners a fee to hold US Treasuries.',                                                           detail:'If allies refuse, charge central banks a fee on Treasury holdings, forcing diversification away from the dollar.' },
  { id:'n27', cat:'strategy',   title:'The Milan Formula',            summary:'Impose high tariffs -> lower them for concessions.',                                                      detail:'Impose very high tariffs unilaterally, then offer to lower them in exchange for China cooperation or US investment.' },
  { id:'n28', cat:'strategy',   title:'April 2 Bond Crash',           summary:'Excel tariff list crashed bonds: 10yr yield +60bp in a week.',                                            detail:'A list of specific tariff rates announced on April 2 triggered a bond shock. The 10yr Treasury yield surged 60bp in a week.' },
  { id:'n29', cat:'strategy',   title:'The Numbers',                  summary:'GDP $29T. Deficit $1.8T. Imports $3.3T. 20% tariff best: $660B.',                                        detail:'GDP is $29T. Spending $6.75T vs revenue $4.9T = $1.8T deficit. 20% universal tariff raises $660B best case, covering only 1/3 of the deficit.' },
  { id:'n30', cat:'paradox',    title:'Tariff Paradox #1',            summary:'Tariffs raise prices -> Fed hikes -> debt costs explode.',                                                detail:'Tariffs cause inflation. The Fed raises rates. Higher rates explode the cost of servicing $34T+ national debt.' },
  { id:'n31', cat:'paradox',    title:'Tariff Paradox #2',            summary:'Tariffs strengthen USD -> hurts manufacturing competitiveness.',                                         detail:'Tariffs reduce dollar supply globally. Stronger dollar makes US exports expensive and imports cheap, undermining reshoring.' },
  { id:'n32', cat:'paradox',    title:'The Dollar Paradox',           summary:'Want allies to sell USD AND maintain dollar supremacy. Mutually exclusive.',                               detail:'US wants allies to sell dollars (weaker USD) but also wants dollar hegemony. These goals are mutually exclusive.' },
  { id:'n33', cat:'paradox',    title:'The Fed Paradox',              summary:'Trump wants low rates. Fed wants to raise to fight tariff inflation.',                                   detail:'Trump wants low rates for growth. The Fed must raise rates to fight tariff-driven inflation. Irreconcilable.' },
  { id:'n34', cat:'paradox',    title:'China Alignment',              summary:'Adversaries, aligned incentives: both want rate cuts.',                                                  detail:'US and China both want lower rates and a weaker dollar. Enemies with overlapping interests is a fragile alignment.' },
  { id:'n35', cat:'paradox',    title:'The Execution Paradox',        summary:'Shock-and-retreat destroyed risk-free trust. Trump Risk Premium born.',                                  detail:'Erratic implementation eroded the risk-free status of Treasuries. Investors now demand a Trump Risk Premium.' },
  { id:'n36', cat:'bottomline', title:'The Bottom Line',              summary:'Global trading system being restructured. Growth no longer #1 priority.',                                  detail:'The 70-year era of trade liberalization is over. Strategic rivalry and national security now drive trade policy.' },
];

function getLayoutedElements(nodes, edges) {
  var g = new dagre.graphlib.Graph();
  g.setDefaultEdgeLabel(function() { return {}; });
  g.setGraph({ rankdir:'TB', ranksep:120, nodesep:100, marginx:80, marginy:80 });
  var w = 270, h = 95;
  nodes.forEach(function(n) { g.setNode(n.id, { width:w, height:h }); });
  edges.forEach(function(e) { g.setEdge(e.source, e.target); });
  dagre.layout(g);
  var ln = nodes.map(function(n) {
    var p = g.node(n.id);
    return Object.assign({}, n, { type:'knowledgeNode', position:{ x:p.x-w/2, y:p.y-h/2 }, data:Object.assign({}, n) });
  });
  var se = edges.map(function(e) {
    return Object.assign({}, e, { type:'smoothstep', animated:true, style:{ stroke:'#33335a', strokeWidth:1.5 }, markerEnd:{ type:'arrowclosed', color:'#44446a', width:16, height:16 } });
  });
  return { nodes:ln, edges:se };
}

function KnowledgeNode(props) {
  var cat = CAT[props.data.cat] || CAT.mechanics;
  return h('div', { className:'kg-node', style:{
    borderColor:props.selected?cat.hex:void 0,
    boxShadow:props.selected?'0 0 20px '+cat.hex+'33':void 0
  }},
    h('div', { className:'accent-bar', style:{ background:cat.hex } }),
    h('div', { className:'node-title' }, props.data.title),
    h('div', { className:'node-summary' }, props.data.summary)
  );
}

function DetailPanel(props) {
  if (!props.node) return null;
  var cat = CAT[props.node.cat] || CAT.mechanics;
  return h('div', { className:'detail-overlay open' },
    h('div', { className:'detail-header' },
      h('h3', { style:{ color:cat.hex } }, props.node.title),
      h('button', { className:'detail-close', onClick:props.onClose }, '\u2715')
    ),
    h('div', { className:'detail-body' },
      h('span', { className:'cat-badge', style:{ background:cat.hex+'22', color:cat.hex, border:'1px solid '+cat.hex+'44' } }, cat.icon+' '+cat.label),
      h('p', null, props.node.detail)
    )
  );
}

function GraphView() {
  var initial = useMemo(function() { return getLayoutedElements(rawNodes, rawEdges); }, []);
  var ns = useState(initial.nodes), nodes = ns[0];
  var es = useState(initial.edges), edges = es[0];
  var ss = useState(null), sel = ss[0], setSel = ss[1];
  var rf = useRef(null);
  var onClick = useCallback(function(e, n) { setSel(n); }, []);
  var onClose = useCallback(function() { setSel(null); }, []);
  var onPane = useCallback(function() { setSel(null); }, []);
  useEffect(function() {
    setTimeout(function() {
      if (rf.current && rf.current.fitView) rf.current.fitView({ padding:.2, duration:800 });
    }, 500);
  }, []);
  return h('div', { className:'graph-area' },
    h(ReactFlow, {
      ref:rf, nodes:nodes, edges:edges,
      onNodeClick:onClick, onPaneClick:onPane,
      nodeTypes:{ knowledgeNode:KnowledgeNode },
      fitView:false, minZoom:.15, maxZoom:2.5,
      defaultViewport:{ x:0, y:0, zoom:1 },
      proOptions:{ hideAttribution:true },
      style:{ background:'#0a0a0f' }
    },
      h(Background, { color:'#1e1e30', gap:24, size:1 }),
      h(Controls, { position:'bottom-left', style:{ margin:16 } }),
      h(MiniMap, {
        position:'bottom-right',
        style:{ margin:16, borderRadius:10, border:'1px solid #25253a', background:'#12121a' },
        nodeColor:function(n) { var c=CAT[n.data&&n.data.cat]; return c?c.hex:'#888'; },
        maskColor:'rgba(10,10,15,0.7)'
      })
    ),
    h(DetailPanel, { node:sel, onClose:onClose })
  );
}

function PasswordGate(props) {
  var ps = useState(''), pw = ps[0], setPw = ps[1];
  var es = useState(''), err = es[0], setErr = es[1];
  var sub = function(e) {
    e.preventDefault();
    var enc = new TextEncoder();
    crypto.subtle.digest('SHA-256', enc.encode(pw)).then(function(buf) {
      var h = Array.from(new Uint8Array(buf)).map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');
      if (h === '2ff51fba4b8b1137a97ed27dfbd357e5b690665b2f016c308d95b05febf5bf7e') {
        localStorage.setItem('unlocked_tariff', '1');
        props.onUnlock();
      } else { setErr('Incorrect password. Try again.'); }
    });
  };
  return h('div', { className:'pw-gate' },
    h('h1', null, 'Tariffs, Trade & The New World Order'),
    h('p', { className:'sub' }, 'Interactive Knowledge Graph'),
    h('form', { onSubmit:sub },
      h('input', { type:'password', placeholder:'Enter password', value:pw, onChange:function(e){setPw(e.target.value);setErr('');}, autoFocus:true }),
      h('button', { type:'submit' }, 'Unlock')
    ),
    err ? h('div', { className:'err' }, err) : null,
    h('div', { className:'hint' }, 'Restricted access \u2014 enter password to continue')
  );
}

function App() {
  var us = useState(function() { try { return localStorage.getItem('unlocked_tariff')==='1'; } catch(e){return false;} });

      h('span', null, "Based on \u5c0fLin\u8bf4's 3-part series"),
      h('span', { className:'sep' }, '|'),
      h('a', { href:'https://youtu.be/uiMsul6sKus', target:'_blank', rel:'noopener' }, 'Tariffs 101'),
      h('span', { className:'sep' }, '\u00b7'),
      h('a', { href:'https://youtu.be/XDXeZk6a170', target:'_blank', rel:'noopener' }, 'Trade Deficit'),
      h('span', { className:'sep' }, '\u00b7'),
      h('a', { href:'https://youtu.be/Op_lsH_ys5g', target:'_blank', rel:'noopener' }, "Trump's Strategy"),
      h('span', { className:'sep' }, '|'),

}
