<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: #25253a;
  --text: #e4e4ed;
  --text-muted: #8888a0;
  --accent-blue: #60a5fa;
  --accent-amber: #f59e0b;
  --accent-purple: #a855f7;
  --accent-green: #10b981;
  --accent-orange: #f97316;
  --accent-red: #ef4444;
  --accent-gold: #fbbf24;
}

html, body, #root {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--text);
}

/* ─── password gate ─── */
.pw-gate {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  background: radial-gradient(ellipse at center, #12122a 0%, #0a0a0f 70%);
}
.pw-gate h1 {
  font-size: 1.75rem; font-weight: 700; color: var(--text);
  margin-bottom: 0.5rem; text-align: center; line-height: 1.3;
}
.pw-gate p.sub { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }
.pw-gate form {
  display: flex; gap: 0.75rem; align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 0.5rem; padding-left: 1rem;
}
.pw-gate input {
  background: transparent; border: none; outline: none;
  color: var(--text); font-size: 1rem; width: 220px;
  font-family: 'JetBrains Mono', monospace;
}
.pw-gate input::placeholder { color: #555; }
.pw-gate button {
  background: var(--accent-purple); color: #fff; border: none;
  padding: 0.6rem 1.4rem; border-radius: 8px; font-weight: 600;
  cursor: pointer; font-size: 0.9rem; transition: background 0.2s;
}
.pw-gate button:hover { background: #7c3aed; }
.pw-gate .err {
  color: var(--accent-red); font-size: 0.8rem; margin-top: 0.75rem;
  min-height: 1.2em;
}
.pw-gate .hint {
  margin-top: 1.5rem; color: var(--text-muted); font-size: 0.75rem;
  opacity: 0.5;
}

/* ─── main layout ─── */
.app-shell {
  width: 100%; height: 100%; display: flex; flex-direction: column;
}

/* top bar */
.topbar {
  height: 52px; flex-shrink: 0;
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 1.25rem;
  z-index: 20;
}
.topbar h2 {
  font-size: 1rem; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* graph area */
.graph-area {
  flex: 1; position: relative; overflow: hidden;
}

/* detail panel */
.detail-overlay {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(420px, 100vw);
  background: var(--surface2);
  border-left: 1px solid var(--border);
  z-index: 15;
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; flex-direction: column;
  box-shadow: -8px 0 30px rgba(0,0,0,0.5);
}
.detail-overlay.open { transform: translateX(0); }
.detail-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 1.25rem 1.25rem 0.75rem 1.25rem;
  flex-shrink: 0;
}
.detail-header h3 {
  font-size: 1.15rem; font-weight: 700; padding-right: 0.5rem;
  line-height: 1.3;
}
.detail-close {
  background: var(--border); color: var(--text-muted); border: none;
  width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background 0.15s;
}
.detail-close:hover { background: #33334d; color: #fff; }
.detail-body {
  flex: 1; overflow-y: auto; padding: 0 1.25rem 1.25rem 1.25rem;
}
.detail-body p {
  font-size: 0.9rem; line-height: 1.7; color: var(--text-muted);
}
.detail-body .cat-badge {
  display: inline-block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; padding: 0.2rem 0.6rem; border-radius: 6px;
  margin-bottom: 1rem;
}

/* bottom bar */
.bottombar {
  height: 40px; flex-shrink: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  padding: 0 1rem; gap: 1.25rem;
  font-size: 0.72rem; color: var(--text-muted);
  z-index: 20;
}
.bottombar a { color: var(--accent-blue); text-decoration: none; }
.bottombar a:hover { text-decoration: underline; }
.bottombar .sep { color: #444; }

/* ─── react flow overrides ─── */
.react-flow__attribution { display: none !important; }
.react-flow__minimap {
  border-radius: 10px !important;
  border: 1px solid var(--border) !important;
  background: var(--surface) !important;
}
.react-flow__controls {
  border-radius: 10px !important; overflow: hidden;
  border: 1px solid var(--border) !important;
  background: var(--surface) !important;
}
.react-flow__controls-button {
  background: var(--surface) !important;
  border-bottom: 1px solid var(--border) !important;
  fill: var(--text-muted) !important;
  width: 30px !important; height: 30px !important;
}
.react-flow__controls-button:hover {
  background: var(--surface2) !important;
}

/* ─── custom node ─── */
.kg-node {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem 0.9rem;
  min-width: 240px; max-width: 280px;
  cursor: grab;
  transition: box-shadow 0.2s, border-color 0.2s;
  position: relative;
  overflow: hidden;
}
.kg-node:hover {
  box-shadow: 0 0 18px rgba(108,92,231,0.18);
  border-color: #444;
}
.kg-node .accent-bar {
  position: absolute; left: 0; top: 9px; bottom: 9px;
  width: 3px; border-radius: 0 3px 3px 0;
}
.kg-node .node-title {
  font-size: 0.82rem; font-weight: 600; color: var(--text);
  margin-bottom: 0.25rem; line-height: 1.25;
  padding-left: 8px;
}
.kg-node .node-summary {
  font-size: 0.7rem; color: var(--text-muted); line-height: 1.4;
  padding-left: 8px;
}

/* ─── mobile ─── */
@media (max-width: 640px) {
  .detail-overlay { width: 100vw; }
  .topbar h2 { font-size: 0.82rem; }
  .bottombar { font-size: 0.65rem; gap: 0.6rem; }
  .kg-node { min-width: 180px; max-width: 220px; }
  .kg-node .node-title { font-size: 0.74rem; }
  .kg-node .node-summary { font-size: 0.65rem; }
  .pw-gate h1 { font-size: 1.3rem; }
  .pw-gate input { width: 160px; font-size: 0.85rem; }
}

const rawNodes = [
  { id:'n1',  cat:'mechanics',  title:'What Is a Tariff?',            summary:'A tax on imported goods paid by the importer but ultimately borne by consumers.',                          detail:'A tariff is a tax levied by a government on goods imported from another country. While importers pay the tax at the border, the cost is usually passed on to consumers through higher prices. Tariffs are one of the oldest trade policy tools, used both for revenue and for protecting domestic industries from foreign competition.' },
  { id:'n2',  cat:'mechanics',  title:'Milk Tea Example',             summary:'20% tariff: $100 item → $120 for consumer, $20 goes to government revenue.',                               detail:'Consider Milk Tea Kingdom, which imposes a 20% tariff on imported milk tea. A product originally priced at $100 now incurs a $20 tariff, pushing the consumer price to $120. The government collects $20 in revenue. This simple example illustrates the mechanics: the importer pays the tax, but the end consumer bears the cost. Domestic milk tea producers benefit because the imported version is now relatively more expensive.' },
  { id:'n3',  cat:'mechanics',  title:'Winners of Tariffs',           summary:'Government (revenue) and domestic producers (less competition, higher prices, more jobs).',                   detail:'Tariffs produce clear winners: (1) Government collects revenue directly from every imported unit. (2) Domestic producers face less foreign competition, allowing them to raise prices, expand production, and hire more workers. In the US, steel tariffs boosted domestic steel profits. In the 19th century, high US tariffs (>40%) helped domestic industry grow 500x.' },
  { id:'n4',  cat:'mechanics',  title:'Losers of Tariffs',            summary:'Consumers pay 34% more. Downstream industries suffer — steel tariffs cost Ford $1B+.',                       detail:'Tariffs hurt two key groups: (1) Consumers pay higher prices — washing machine tariffs in 2018 caused prices to rise 34% on average. (2) Downstream industries that use imported inputs face cost increases. When US steel tariffs were imposed, Ford Motor Company estimated they cost the company over $1 billion. The auto industry employs far more workers than steel — making the trade-off questionable.' },
  { id:'n5',  cat:'mechanics',  title:'Deadweight Loss',              summary:'Classical economics: tariffs always create a net welfare loss for society.',                                detail:'In classical economics, tariffs invariably generate deadweight loss — a net destruction of value. Even though the government gains revenue and domestic producers gain market share, the losses to consumers exceed those gains. The triangle of deadweight loss represents transactions that would have occurred at the free-market price but are prevented by the tariff. This is the foundational argument for free trade.' },
  { id:'n6',  cat:'mechanics',  title:'Why Tariffs Still Exist',      summary:'Infant industry protection, negotiation leverage, political appeal, and strategic rivalry.',                detail:'Despite the deadweight loss argument, tariffs persist for several reasons: (1) Infant Industry Protection — shielding nascent domestic industries until they reach global competitiveness. (2) Negotiation Leverage — tariffs serve as bargaining chips in trade negotiations. (3) Political Appeal — protecting domestic jobs resonates with voters, especially in swing states. (4) National Security — protecting critical supply chains from adversarial nations. The world is messier than the textbook.' },
  { id:'n7',  cat:'mechanics',  title:'Infant Industry Success',      summary:'Hamilton\'s US tariffs >40% → steel output 500x. China car tariffs >200%.',                                   detail:'Alexander Hamilton championed protective tariffs for the young United States. Throughout the 1800s, US tariffs exceeded 40%, and the result was explosive industrial growth: steel output increased 500-fold and the US overtook Britain as the world\'s largest economy. Modern China applies the same playbook — tariffs on imported cars exceed 200%, forcing foreign automakers to manufacture locally and transfer technology to Chinese joint ventures.' },
  { id:'n8',  cat:'mechanics',  title:'The Chicken-Truck War',        summary:'1963: a tit-for-tat tariff spiral between the US and Europe that escalated out of control.',                   detail:'In 1963, the US imposed tariffs on European chicken imports. Europe retaliated with tariffs on American trucks, targeting the Volkswagen-competitive US auto sector. The retaliation worked so well that the 25% "chicken tax" on light trucks remains in place to this day. This episode is a textbook case of how tariff retaliation can spiral, creating lasting distortions that far outlive the original dispute.' },
  { id:'n9',  cat:'economics',  title:'Prisoner\'s Dilemma',          summary:'Two countries choose between Open (free trade) or Protect (tariffs).',                                    detail:'Trade policy is a classic Prisoner\'s Dilemma. Each country faces two choices: maintain open markets (cooperate) or impose tariffs (defect). If both cooperate, they share prosperity. But each is tempted to defect — imposing tariffs while the other stays open yields a huge unilateral gain. When both defect, they create mutual destruction. The structure of incentives pushes rational actors toward a collectively bad outcome.' },
  { id:'n10', cat:'economics',  title:'The Payoff Matrix',            summary:'Both open = +3/+3. One protects = +8/−5. Both protect = −3/−3.',                                        detail:'The payoff matrix: When both countries keep free trade, each gains +3 (mutual prosperity). If Country A imposes tariffs while Country B stays open, A gains +8 (tariff revenue + protected industry) while B loses −5 (lost exports). If both impose tariffs, both lose −3 (collapsed trade, higher prices). The dominant strategy for a self-interested rational actor is to protect — even though both would be better off cooperating.' },
  { id:'n11', cat:'economics',  title:'Nash Equilibrium',             summary:'Rational self-interest leads both countries to protect → mutual loss.',                                  detail:'The Nash Equilibrium of the trade Prisoner\'s Dilemma is (Protect, Protect). Neither country can unilaterally improve its outcome by switching — if the other country protects, any deviation to "open" yields an even worse outcome (−5). This is why, without institutions or repeated interaction, the default outcome of international trade relations is protectionism and mutual loss.' },
  { id:'n12', cat:'economics',  title:'Tit-for-Tat & Repeated Games', summary:'In repeated interactions, cooperating first and mirroring the partner\'s last move breaks the trap.',          detail:'When trade relationships are repeated (not one-shot), the tit-for-tat strategy becomes powerful: start by cooperating, then do whatever the other party did last round. If both sides use tit-for-tat, cooperation becomes self-reinforcing. Fear of future retaliation deters defection. This is why long-term trade relationships, rather than one-off decisions, tend toward free trade — but only if both parties trust the game will continue.' },
  { id:'n13', cat:'economics',  title:'WTO & Institutions',           summary:'166 members, 98% of world trade. EU, NAFTA/USMCA provide the trust that breaks the trap.',                detail:'Institutions solve the Prisoner\'s Dilemma by providing trust and enforcement. The WTO (166 members, covering ~98% of world trade) establishes rules, adjudicates disputes, and authorizes retaliatory measures — converting the game from anarchy to rule-of-law. Regional blocs like the EU and USMCA deepen integration further, eliminating the "defect" option for entire categories of trade. These institutions are the scaffolding that makes free trade stable.' },
  { id:'n14', cat:'history',    title:'Mercantilism (1700s–1800s)',   summary:'Britain averaged ~50% tariffs. Colonies existed to supply the mother country.',                            detail:'In the mercantilist era, European powers viewed trade as zero-sum. Britain imposed average tariffs of ~50%, and colonial possessions were restricted to trading only with the mother country. The goal was to accumulate gold, maintain a trade surplus, and build national power. Adam Smith\'s The Wealth of Nations (1776) attacked this system, arguing that the true wealth of nations came from specialization and exchange, not hoarding precious metals.' },
  { id:'n15', cat:'history',    title:'Comparative Advantage (1817)', summary:'David Ricardo: specialize in what you do relatively best, trade for everything else.',                     detail:'In 1817, David Ricardo articulated the theory of Comparative Advantage — the intellectual cornerstone of free trade. Even if one country is better at producing everything, both countries still benefit from trade by specializing in what they do relatively best. This insight shifted economics from a zero-sum to a positive-sum framework. It remains the most powerful argument for free trade, though critics note its assumptions (full employment, immobile capital) rarely hold perfectly in reality.' },
  { id:'n16', cat:'history',    title:'US & Germany Industrialize',   summary:'1800s: Both ignored free trade advice. Tariffs >40%. US steel grew 500x and overtook Britain.',            detail:'Despite Ricardo\'s elegant theory, the two great industrializers of the 19th century — the United States and Germany — explicitly rejected free trade. Friedrich List argued that Britain\'s free trade advocacy was "kicking away the ladder" that Britain itself had used to industrialize. The US maintained tariffs above 40% throughout the 1800s, growing steel output 500-fold and overtaking Britain as the world\'s largest economy.' },
  { id:'n17', cat:'history',    title:'Smoot-Hawley Tariff (1930)',   summary:'20–60% tariffs on 20,000+ goods. World trade collapsed by 66%. Deepened the Great Depression.',                detail:'The Smoot-Hawley Tariff Act of 1930 raised US tariffs to 20–60% on over 20,000 imported goods. Other countries retaliated fiercely. Global trade collapsed by ~66% over the next few years, turning a severe recession into the Great Depression. Smoot-Hawley became the canonical example of what NOT to do — a catastrophic failure of protectionism that economists still invoke whenever new tariffs are proposed.' },
  { id:'n18', cat:'history',    title:'GATT & Free Trade Era (1947)', summary:'Average tariffs fell from 22% → 5%. Global exports rose from 5% → 25% of GDP. The golden age of trade.',     detail:'After WWII, 23 nations signed the General Agreement on Tariffs and Trade (GATT) in 1947 — later evolving into the WTO. Over the next 50 years, average tariffs fell from ~22% to ~5%, and exports grew from 5% to over 25% of global GDP. This was the golden age of trade liberalization. Hundreds of millions of people were lifted out of poverty, particularly in East Asia, through export-led growth made possible by open global markets.' },
  { id:'n19', cat:'history',    title:'US-China Trade War (2018–Now)',summary:'Tariffs, tech restrictions, supply chain decoupling. Brexit, pandemic nationalism, and the return of deglobalization.', detail:'Starting in 2018, the US launched a sweeping tariff campaign against China, imposing duties on hundreds of billions of dollars of goods. China retaliated. The conflict expanded beyond tariffs into technology restrictions (Huawei, semiconductors), supply chain decoupling, and broader strategic rivalry. Combined with Brexit and pandemic-era nationalism, the era of deglobalization began — reversing a 70-year trend toward economic integration.' },
  { id:'n20', cat:'economics',  title:'The US Trade Deficit',         summary:'Current Account: −Trillions since the 1970s. The US imports far more than it exports.',                     detail:'The US has run a persistent current account deficit — importing more goods and services than it exports — every year since the mid-1970s. By 2024, the annual trade deficit exceeded $1 trillion. This is the mirror image of other countries\' trade surpluses with the US (China, Japan, Germany). Importantly, this deficit is matched dollar-for-dollar by a surplus on the financial/capital account: foreign capital flowing into US assets.' },
  { id:'n21', cat:'economics',  title:'The Circular Flow',            summary:'Countries earn USD → buy Treasuries → USD appreciates → deficit widens → repeat for 50+ years.',            detail:'The US trade deficit creates a self-reinforcing cycle: (1) Exporting countries earn US dollars from their trade surpluses. (2) Central banks accumulate USD reserves and reinvest them in US Treasuries. (3) This capital inflow strengthens the US dollar, making imports cheaper and US exports more expensive. (4) The trade deficit widens further, supplying even more dollars to the world. The cycle has been running for over 50 years — it\'s not a bug; it\'s a structural feature.' },
  { id:'n22', cat:'economics',  title:'The Triffin Dilemma',          summary:'A reserve-currency issuer MUST run trade deficits to supply the world with its currency.',                   detail:'Robert Triffin predicted in the 1960s that the country issuing the world\'s reserve currency would inevitably run trade deficits. To supply the global economy with dollars for trade, reserves, and financial markets, the US must spend more abroad than it earns — i.e., run a deficit. This is not a policy failure; it\'s a structural necessity. The dilemma: the system needs US deficits to function, but persistent deficits erode confidence in the dollar\'s value over the long run.' },
  { id:'n23', cat:'economics',  title:'Healthy vs Unhealthy Deficits',summary:'Australia: investment-driven ✓. Greece/Spain pre-2010: overheated ✗. Sri Lanka: currency collapse ✗.',          detail:'Not all trade deficits are equal. Australia has run deficits for decades, but foreign capital flows into productive investments (mines, infrastructure), driving growth. In contrast, Greece and Spain pre-2010 used foreign borrowing for consumption and housing bubbles — unsustainable. Sri Lanka\'s deficit was financed by borrowing that it could not repay, leading to a 2022 currency collapse and sovereign default. The key distinction: what is the borrowed money used for?' },
  { id:'n24', cat:'strategy',   title:'The Milan Framework',          summary:'Stephen Milan\'s 7-goal framework. Economic growth is no longer #1 — a radical departure from orthodoxy.',       detail:'Stephen Milan\'s "A User\'s Guide to Restructuring the Global Trading System" lays out a 7-goal framework for Trump\'s trade strategy. Core goals: (1) Government Finances, (2) Manufacturing Reshoring, (3) Restricting China. Compromise goals: (4) Economic Growth, (5) Price Stability. Sacrificeable: (6) Dollar Hegemony. The framework is radical because economic growth — traditionally the #1 objective of all economic policy — is demoted to a "compromise" that can be sacrificed if it conflicts with higher priorities.' },
  { id:'n25', cat:'strategy',   title:'Mar-a-Lago Accord (Multilateral)',summary:'Devalue USD with allied agreement. Roll Treasuries into 50–100yr bonds. Fed provides swap lines.',            detail:'The multilateral prong of the Milan framework envisions a "Mar-a-Lago Accord" — a negotiated agreement with allied economies (Japan, EU, UK) to jointly devalue the US dollar, similar to the 1985 Plaza Accord but far more ambitious. Allies would agree to strengthen their currencies. The US would restructure its debt by rolling short-term Treasuries into ultra-long 50–100 year bonds. The Fed would provide swap lines to smooth the transition. This requires willing cooperation from partners.' },
  { id:'n26', cat:'strategy',   title:'Unilateral Strategy',          summary:'Charge foreign institutions a fee to hold US Treasuries — a tax on dollar reserves.',                        detail:'If allies refuse to cooperate, the unilateral backup is more aggressive: charge foreign official institutions (central banks, sovereign wealth funds) a fee — essentially a tax — on their holdings of US Treasuries. By making it costly for foreigners to hold US debt, the US would force reserve diversification away from the dollar, achieving depreciation without needing anyone\'s permission. This is a nuclear option with unpredictable consequences for global financial stability.' },
  { id:'n27', cat:'strategy',   title:'The Milan Formula',            summary:'Impose very high tariffs → offer to lower them in exchange for cooperation, investment, or security concessions.', detail:'The Milan Formula is a negotiation strategy: impose extremely high tariffs unilaterally, creating maximum disruption, then offer to lower them — but only in exchange for specific concessions. These concessions could include: Chinese cooperation on trade rules, foreign investment in US manufacturing, security commitments from allies, or agreement to coordinated currency realignment. The tariffs are not an end; they are a bargaining tool. The higher the initial tariff, the more valuable the concession.' },
  { id:'n28', cat:'strategy',   title:'April 2 Bond Crash',           summary:'The "Excel tariff list" announced on April 2 crashed bond markets: 10yr yield +60bp in a single week.',         detail:'On April 2, a list of specific tariff rates for each country — reportedly calculated in Excel and announced without consultation — triggered a bond market shock. The 10-year Treasury yield surged 60 basis points in a single week, a move typically seen over months or years. Bond prices crashed as investors reassessed "risk-free" assumptions about US debt. This wasn\'t just a market tantrum; it was a signal that the strategy itself carried severe financial risks.' },
  { id:'n29', cat:'strategy',   title:'The Numbers',                  summary:'GDP $29T. Gov spending $6.75T. Deficit $1.8T. Imports $3.3T. 20% universal tariff best case: $660B.',        detail:'The fiscal math is stark: US GDP is ~$29 trillion. Government spending is $6.75T against revenue of $4.9T, creating a $1.8T deficit. Net interest on the debt is already $880B and rising. Total imports are $3.3T per year. A 20% universal tariff would, in the best case (assuming no decline in imports), raise $660B — which covers only about one-third of the annual deficit. Current tariff revenue is just $80B. Tariffs alone cannot close the fiscal gap.' },
  { id:'n30', cat:'paradox',    title:'Tariff Paradox #1',            summary:'Tariffs raise prices → Fed hikes interest rates → debt servicing costs explode.',                           detail:'Paradox #1: The strategy\'s core goals conflict. Tariffs raise consumer prices (inflation). In response, the Federal Reserve would raise interest rates to fight inflation. But higher rates dramatically increase the cost of servicing the $34+ trillion national debt — interest payments, already at $880B/year, would explode further. Tariffs meant to strengthen government finances end up making the fiscal situation worse through higher debt service costs. The medicine harms the patient.' },
  { id:'n31', cat:'paradox',    title:'Tariff Paradox #2',            summary:'Tariffs make the USD appreciate → stronger dollar hurts manufacturing competitiveness.',                    detail:'Paradox #2: Tariffs reduce imports, which reduces the supply of dollars in global markets. Less dollar supply means a stronger dollar. But a stronger dollar makes US exports more expensive and imports cheaper — the exact opposite of what manufacturing reshoring requires. Tariffs intended to boost domestic manufacturing inadvertently create currency conditions that undermine manufacturing competitiveness. The strategy fights itself.' },
  { id:'n32', cat:'paradox',    title:'The Dollar Paradox',           summary:'Want allies to sell the dollar AND maintain dollar supremacy — mutually exclusive goals.',                 detail:'The Dollar Paradox is the deepest tension in the entire strategy: The US wants allies to voluntarily weaken their USD holdings and diversify away from the dollar (to achieve depreciation). But it simultaneously wants to maintain dollar supremacy as the world\'s reserve currency for global influence, sanctions power, and cheap borrowing. These goals are mutually exclusive. If allies sell dollars, hegemony erodes. If hegemony is preserved, depreciation fails. You cannot have both.' },
  { id:'n33', cat:'paradox',    title:'The Fed Paradox',              summary:'Trump wants low rates for growth. The Fed wants to raise rates to fight tariff-driven inflation.',           detail:'The Fed Paradox: President Trump wants low interest rates to fuel economic growth, keep mortgage rates affordable, and reduce government borrowing costs. But the Federal Reserve, an independent institution, is mandated to control inflation. Since tariffs are inherently inflationary, the Fed would respond by raising rates. The White House and the central bank are pointed in opposite directions. Pressuring the Fed to keep rates low despite inflation risks destroying its credibility.' },

/* ─── dagre layout ─── */
function getLayoutedElements(nodes, edges) {
  const g = new dagre.graphlib.Graph();
  g.setDefaultEdgeLabel(() => ({}));
  g.setGraph({ rankdir: 'TB', ranksep: 110, nodesep: 90, marginx: 60, marginy: 60 });

  const NODE_W = 270;
  const NODE_H = 95;

  nodes.forEach(n => { g.setNode(n.id, { width: NODE_W, height: NODE_H }); });
  edges.forEach(e => { g.setEdge(e.source, e.target); });

  dagre.layout(g);

  const layoutedNodes = nodes.map(n => {
    const pos = g.node(n.id);
    return {
      ...n,
      type: 'knowledgeNode',
      position: { x: pos.x - NODE_W / 2, y: pos.y - NODE_H / 2 },
      data: { ...n, width: NODE_W },
    };
  });

  const styledEdges = edges.map(e => ({
    ...e,
    type: 'smoothstep',
    animated: true,
    style: { stroke: '#33335a', strokeWidth: 1.5 },
    markerEnd: { type: MarkerType.ArrowClosed, color: '#44446a', width: 16, height: 16 },
  }));

  return { nodes: layoutedNodes, edges: styledEdges };
}

  if (!node) return null;
  const cat = CAT[node.cat] || CAT.mechanics;
  return (

/* ─── graph view ─── */
function GraphView() {
  const initial = useMemo(() => getLayoutedElements(rawNodes, rawEdges), []);
  const [nodes, setNodes, onNodesChange] = useNodesState(initial.nodes);
  const [edges, setEdges, onEdgesChange] = useEdgesState(initial.edges);
  const [selectedNode, setSelectedNode] = useState(null);
  const reactFlowRef = useRef(null);

  const onNodeClick = useCallback((_evt, node) => {
    setSelectedNode(node);
  }, []);

  const closePanel = useCallback(() => setSelectedNode(null), []);

  const onPaneClick = useCallback(() => setSelectedNode(null), []);

  // fit view after mount
  useEffect(() => {
    const timer = setTimeout(() => {
      reactFlowRef.current?.fitView({ padding: 0.2, duration: 800 });
    }, 200);
    return () => clearTimeout(timer);
  }, []);

  return (
    <div className="graph-area">
      <ReactFlow
        ref={reactFlowRef}
        nodes={nodes}
        edges={edges}
        onNodesChange={onNodesChange}
        onEdgesChange={onEdgesChange}
        onNodeClick={onNodeClick}
        onPaneClick={onPaneClick}
        nodeTypes={nodeTypes}
        fitView={false}
        minZoom={0.15}
        maxZoom={2.5}
        defaultViewport={{ x: 0, y: 0, zoom: 1 }}
        proOptions={{ hideAttribution: true }}
        style={{ background: '#0a0a0f' }}
      >
        <Background color="#1e1e30" gap={24} size={1} />
        <Controls
          position="bottom-left"
          style={{ margin: 16 }}
        />
        <MiniMap
          position="bottom-right"
          style={{ margin: 16, borderRadius: 10, border: '1px solid #25253a', background: '#12121a' }}
          nodeColor={(n) => {
            const c = CAT[n.data?.cat];
            return c ? c.hex : '#888';
          }}
          maskColor="rgba(10,10,15,0.7)"
        />
      </ReactFlow>
      <DetailPanel node={selectedNode} onClose={closePanel} />
    </div>
  );
}

/* ─── password gate ─── */
const EXPECTED_HASH = '2ff51fba4b8b1137a97ed27dfbd357e5b690665b2f016c308d95b05febf5bf7e';

async function hashPassword(password) {
  const encoder = new TextEncoder();
  const data = encoder.encode(password);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

function PasswordGate({ onUnlock }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');
    try {
      const h = await hashPassword(pw);
      if (h === EXPECTED_HASH) {
        localStorage.setItem('unlocked_tariff', '1');
        onUnlock();
      } else {
        setError('Incorrect password. Try again.');
      }
    } catch {
      setError('Error verifying password.');
    }
    setLoading(false);
  };

  return (
    <div className="pw-gate">
      <h1>Tariffs, Trade &amp;<br/>The New World Order</h1>
      <p className="sub">Interactive Knowledge Graph</p>
      <form onSubmit={handleSubmit}>
        <input
          type="password"
          placeholder="Enter password"
          value={pw}
          onChange={e => { setPw(e.target.value); setError(''); }}
          autoFocus
        />
        <button type="submit" disabled={loading}>
          {loading ? '...' : 'Unlock'}
        </button>
      </form>
      <div className="err">{error}</div>
      <div className="hint">Restricted access — enter password to continue</div>
    </div>
  );
}
