,detail:"Tariffs hurt two key groups: (1) Consumers pay higher prices \u2014 washing machine tariffs in 2018 caused prices to rise 34%. (2) Downstream industries that use imported inputs face cost increases."},{id:"n5",cat:"mechanics",title:"Deadweight Loss",summary:"Classical economics: tariffs always create a net welfare loss for society.",detail:"In classical economics, tariffs generate deadweight loss. Even though government gains revenue and domestic producers gain market share, the losses to consumers exceed those gains."},{id:"n6",cat:"mechanics",title:"Why Tariffs Still Exist",summary:"Infant industry protection, negotiation leverage, political appeal, strategic rivalry.",detail:"Despite the deadweight loss argument, tariffs persist for: infant industry protection, negotiation leverage in trade deals, political appeal, and national security."},{id:"n7",cat:"mechanics",title:"Infant Industry Success",summary:"Hamilton tariffs >40% \u2192 steel 500\xD7. China car tariffs >200%.",detail:"Alexander Hamilton championed protective tariffs. US tariffs >40% in the 1800s grew steel output 500-fold."},{id:"n8",cat:"mechanics",title:"The Chicken-Truck War",summary:"1963: tit-for-tat tariff spiral between US and Europe.",detail:'In 1963, US tariffs on European chicken led to European retaliation on American trucks. The 25% "chicken tax" remains today.'},{id:"n9",cat:"economics",title:"Prisoner's Dilemma",summary:"Two countries choose Open (free trade) or Protect (tariffs).",detail:"Trade policy is a Prisoner's Dilemma. Each country chooses cooperate (open) or defect (tariffs). The incentive structure pushes rational actors toward a collectively bad outcome."},{id:"n10",cat:"economics",title:"The Payoff Matrix",summary:"Both open = +3/+3. One protects = +8/\u22125. Both protect = \u22123/\u22123.",detail:"If both cooperate, each gains +3. If A protects while B stays open, A gains +8 while B loses \u22125. If both protect, both lose \u22123."},{id:"n11",cat:"economics",title:"Nash Equilibrium",summary:"Rational self-interest leads both to protect \u2192 mutual loss.",detail:"The Nash Equilibrium is (Protect, Protect). Neither can unilaterally improve by switching. This is why without institutions, the default is protectionism."},{id:"n12",cat:"economics",title:"Tit-for-Tat",summary:"In repeated games, cooperate first then mirror opponent's move.",detail:"When trade is repeated, tit-for-tat works: cooperate first, then mirror the opponent's last move. Fear of retaliation deters defection."},{id:"n13",cat:"economics",title:"WTO and Institutions",summary:"166 members, 98% of world trade. EU, USMCA provide trust.",detail:'Institutions provide trust and enforcement. The WTO establishes rules and adjudicates disputes. Regional blocs like the EU eliminate the "defect" option.'},{id:"n14",cat:"history",title:"Mercantilism (1700s)",summary:"Britain avg tariff ~50%. Colonies served the mother country.",detail:"In the mercantilist era, trade was zero-sum. Britain averaged ~50% tariffs. Adam Smith attacked this system in 1776."},{id:"n15",cat:"history",title:"Comparative Advantage (1817)",summary:"Ricardo: specialize in what you do best, trade for the rest.",detail:"David Ricardo showed that even if one country is better at everything, both benefit from trade by specializing."},{id:"n16",cat:"history",title:"US and Germany Industrialize",summary:"1800s: ignored free trade. Tariffs >40%. Steel 500\xD7. US overtakes Britain.",detail:'The US and Germany rejected free trade advice. Friedrich List argued Britain was "kicking away the ladder."'},{id:"n17",cat:"history",title:"Smoot-Hawley (1930)",summary:"20\u201360% tariffs on 20K+ goods. Trade collapsed 66%. Deepened the Depression.",detail:"Smoot-Hawley raised tariffs to 20\u201360% on 20,000+ goods. Retaliation followed. Global trade fell 66%. The canonical example of protectionism failure."},{id:"n18",cat:"history",title:"GATT and Free Trade (1947)",summary:"Avg tariffs 22%\u21925%. Exports grew 5%\u219225% of GDP. Golden age of trade.",detail:"After WWII, 23 nations signed GATT. Over 50 years, tariffs fell from 22% to 5% and exports grew to 25% of global GDP."},{id:"n19",cat:"history",title:"US-China Trade War (2018)",summary:"Tariffs, tech restrictions, supply chain decoupling, deglobalization.",detail:"Starting in 2018, the US launched tariffs on China. The conflict expanded to tech restrictions and strategic rivalry."},{id:"n20",cat:"economics",title:"The US Trade Deficit",summary:"Current Account: \u2212Trillions since 1970s. US imports > exports.",detail:"The US has run a current account deficit every year since the 1970s. By 2024, it exceeded $1T. This is matched by a financial account surplus."},{id:"n21",cat:"economics",title:"The Circular Flow",summary:"Countries earn USD \u2192 buy Treasuries \u2192 USD appreciates \u2192 deficit widens \u2192 repeat.",detail:"Exporters earn USD. Central banks reinvest in Treasuries. This strengthens the dollar, making imports cheaper, widening the deficit."},{id:"n22",cat:"economics",title:"The Triffin Dilemma",summary:"Reserve-currency issuer MUST run deficits to supply the world.",detail:"Robert Triffin predicted this in the 1960s. To supply dollars globally, the US must run deficits. It is structural, not a policy failure."},{id:"n23",cat:"economics",title:"Healthy vs Unhealthy",summary:"Australia=healthy. Greece pre-2010=unhealthy. Sri Lanka=collapse.",detail:"Not all deficits are equal. Australia uses foreign capital for productive investment. Others used it for consumption."},{id:"n24",cat:"strategy",title:"The Milan Framework",summary:"7-goal framework. Economic growth no longer #1. Radical departure.",detail:"Core goals: Govt Finances, Manufacturing Reshoring, Restrict China. Compromise: Economic Growth, Price Stability. Sacrificeable: Dollar Hegemony."},{id:"n25",cat:"strategy",title:"Mar-a-Lago Accord",summary:"Devalue USD with allies. Roll Treasuries into 50\u2013100yr bonds.",detail:"A negotiated agreement with allies to jointly devalue the USD, similar to 1985 Plaza Accord."},{id:"n26",cat:"strategy",title:"Unilateral Strategy",summary:"Charge foreigners a fee to hold US Treasuries.",detail:"If allies refuse, charge central banks a fee on Treasury holdings, forcing diversification away from the dollar."},{id:"n27",cat:"strategy",title:"The Milan Formula",summary:"Impose high tariffs \u2192 lower them for concessions.",detail:"Impose very high tariffs unilaterally, then offer to lower them in exchange for China cooperation or US investment."},{id:"n28",cat:"strategy",title:"April 2 Bond Crash",summary:"Excel tariff list crashed bonds: 10yr yield +60bp in a week.",detail:"A list of specific tariff rates announced on April 2 triggered a bond shock. The 10yr Treasury yield surged 60bp."},{id:"n29",cat:"strategy",title:"The Numbers",summary:"GDP $29T. Deficit $1.8T. Imports $3.3T. 20% tariff best: $660B.",detail:"GDP is $29T. Spending $6.75T vs revenue $4.9T = $1.8T deficit. 20% universal tariff raises $660B best case."},{id:"n30",cat:"paradox",title:"Tariff Paradox #1",summary:"Tariffs raise prices \u2192 Fed hikes \u2192 debt costs explode.",detail:"Tariffs cause inflation. The Fed raises rates. Higher rates explode the cost of servicing $34T+ national debt."},{id:"n31",cat:"paradox",title:"Tariff Paradox #2",summary:"Tariffs strengthen USD \u2192 hurts manufacturing competitiveness.",detail:"Tariffs reduce dollar supply globally. Stronger dollar makes US exports expensive and imports cheap, undermining reshoring."},{id:"n32",cat:"paradox",title:"The Dollar Paradox",summary:"Want allies to sell USD AND maintain dollar supremacy. Mutually exclusive.",detail:"US wants allies to sell dollars (weaker USD) but also wants dollar hegemony. These goals are mutually exclusive."},{id:"n33",cat:"paradox",title:"The Fed Paradox",summary:"Trump wants low rates. Fed wants to raise to fight tariff inflation.",detail:"Trump wants low rates for growth. The Fed must raise rates to fight tariff-driven inflation. Irreconcilable."},{id:"n34",cat:"paradox",title:"China Alignment",summary:"Adversaries, aligned incentives: both want rate cuts.",detail:"US and China both want lower rates and a weaker dollar. Enemies with overlapping interests is a fragile alignment."},{id:"n35",cat:"paradox",title:"The Execution Paradox",summary:"Shock-and-retreat destroyed risk-free trust. Trump Risk Premium born.",detail:"Erratic implementation eroded the risk-free status of Treasuries. Investors now demand a Trump Risk Premium."},{id:"n36",cat:"bottomline",title:"The Bottom Line",summary:"Global trading system being restructured. Growth no longer #1 priority.",detail:"The 70-year era of trade liberalization is over. Strategic rivalry and national security now drive trade policy."}],jZ=[{id:"e1",source:"n1",target:"n2"},{id:"e2",source:"n2",target:"n3"},{id:"e3",source:"n2",target:"n4"},{id:"e4",source:"n3",target:"n5"},{id:"e5",source:"n4",target:"n5"},{id:"e6",source:"n5",target:"n6"},{id:"e7",source:"n6",target:"n7"},{id:"e8",source:"n6",target:"n8"},{id:"e9",source:"n6",target:"n9"},{id:"e10",source:"n9",target:"n10"},{id:"e11",source:"n10",target:"n11"},{id:"e12",source:"n11",target:"n12"},{id:"e13",source:"n12",target:"n13"},{id:"e14",source:"n7",target:"n14"},{id:"e15",source:"n14",target:"n15"},{id:"e16",source:"n15",target:"n16"},{id:"e17",source:"n16",target:"n17"},{id:"e18",source:"n17",target:"n18"},{id:"e19",source:"n18",target:"n19"},{id:"e20",source:"n19",target:"n20"},{id:"e21",source:"n20",target:"n21"},{id:"e22",source:"n21",target:"n22"},{id:"e23",source:"n22",target:"n23"},{id:"e24",source:"n23",target:"n24"},{id:"e25",source:"n20",target:"n24"},{id:"e26",source:"n24",target:"n25"},{id:"e27",source:"n24",target:"n26"},{id:"e28",source:"n25",target:"n27"},{id:"e29",source:"n26",target:"n27"},{id:"e30",source:"n27",target:"n28"},{id:"e31",source:"n28",target:"n29"},{id:"e32",source:"n29",target:"n30"},{id:"e33",source:"n24",target:"n30"},{id:"e
