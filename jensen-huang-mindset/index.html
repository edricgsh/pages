<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jensen Huang: The Mindset That Built NVIDIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<link rel="stylesheet" href="/pages/_shared/menu.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0b0b12;
    --surface: #12121c;
    --surface2: #18182a;
    --border: rgba(255,255,255,0.06);
    --text: #d0d0d8;
    --text-dim: #6b6b80;
    --accent: #76b900;
    --accent-dim: #5a8f00;
    --gold: #f0c040;
    --radius: 12px;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    padding: 40px 24px;
    min-height: 100vh;
  }

  /* ─── Hero ─── */
  .hero {
    max-width: 900px;
    margin: 0 auto 60px;
    text-align: center;
    padding-top: 20px;
  }
  .hero .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(118,185,0,0.1);
    border: 1px solid rgba(118,185,0,0.2);
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.15;
    color: #f0f0f0;
    margin-bottom: 16px;
  }
  .hero h1 span {
    color: var(--accent);
  }
  .hero .sub {
    font-size: 16px;
    color: var(--text-dim);
    max-width: 640px;
    margin: 0 auto;
  }
  .hero .meta {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hero .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-dim); }

  /* ─── Quote Bar ─── */
  .quote-bar {
    max-width: 800px;
    margin: 0 auto 50px;
    background: var(--surface);
    border-left: 3px solid var(--gold);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 24px 32px;
  }
  .quote-bar blockquote {
    font-size: 18px;
    font-weight: 500;
    font-style: italic;
    color: #e0e0e8;
    line-height: 1.6;
    margin-bottom: 8px;
  }
  .quote-bar .attr {
    font-size: 13px;
    color: var(--gold);
    font-weight: 600;
  }

  /* ─── Section ─── */
  .container {
    max-width: 860px;
    margin: 0 auto;
  }
  section {
    margin-bottom: 48px;
  }
  section h2 {
    font-size: 22px;
    font-weight: 700;
    color: #f0f0f0;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  section h2 .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(118,185,0,0.12);
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    flex-shrink: 0;
  }
  section h2 .emoji-label {
    font-size: 24px;
    flex-shrink: 0;
  }
  section p, section li {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 12px;
  }

  /* ─── Cards ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 28px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: rgba(118,185,0,0.15); }
  .card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .card h3 {
    font-size: 17px;
    font-weight: 600;
    color: #f0f0f0;
    margin-bottom: 8px;
  }
  .card p {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 0;
  }

  /* ─── Table-like grid ─── */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }

  .grid-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 4px;
  }

  /* ─── Callout ─── */
  .callout {
    background: rgba(118,185,0,0.06);
    border: 1px solid rgba(118,185,0,0.15);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
  }
  .callout .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
  }
  .callout p { font-size: 14px; margin-bottom: 0; }

  .callout-gold {
    background: rgba(240,192,64,0.06);
    border: 1px solid rgba(240,192,64,0.15);
  }
  .callout-gold .label { color: var(--gold); }

  .callout-red {
    background: rgba(239,68,68,0.06);
    border: 1px solid rgba(239,68,68,0.15);
  }
  .callout-red .label { color: #ef4444; }

  /* ─── Key-value rows ─── */
  .kv-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .kv-row:last-child { border-bottom: none; }
  .kv-row .k {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    min-width: 100px;
    flex-shrink: 0;
  }
  .kv-row .v {
    font-size: 14px;
    color: var(--text);
  }

  /* ─── Tags ─── */
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .tag {
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 14px;
    background: rgba(118,185,0,0.08);
    border: 1px solid rgba(118,185,0,0.12);
    color: var(--accent);
  }
  .tag-gold {
    background: rgba(240,192,64,0.08);
    border-color: rgba(240,192,64,0.12);
    color: var(--gold);
  }
  .tag-blue {
    background: rgba(59,130,246,0.08);
    border-color: rgba(59,130,246,0.12);
    color: #60a5fa;
  }

  /* ─── Footer ─── */
  .footer {
    max-width: 860px;
    margin: 60px auto 0;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 12px;
    color: var(--text-dim);
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ─── Password Gate ─── */
  #password-gate {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s, visibility 0.4s;
  }
  #password-gate.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .gate-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    max-width: 380px;
    width: 90%;
    text-align: center;
  }
  .gate-box .lock-icon { font-size: 40px; margin-bottom: 12px; }
  .gate-box h1 { font-size: 20px; font-weight: 700; color: #f0f0f0; margin-bottom: 8px; }
  .gate-box p { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
  .gate-box input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: #f0f0f0;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .gate-box input:focus { border-color: var(--accent); }
  .gate-box .error {
    margin-top: 10px;
    font-size: 13px;
    color: #ef4444;
    display: none;
  }
  .gate-box .error.show { display: block; }
</style>
</head>
<body>

<div id="password-gate">
  <div class="gate-box">
    <div class="lock-icon">🔐</div>
    <h1>Password Required</h1>
    <p>Enter the passcode to view this artifact.</p>
    <input type="password" id="password-input" placeholder="Enter password" autocomplete="off" />
    <div class="error" id="password-error">Incorrect password. Try again.</div>
  </div>
</div>
<div id="protected-content"><!-- encrypted --></div>

      const d = await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
      return new TextDecoder().decode(d);
    } catch(e) { return null; }
  }
  (async()=>{
    const st = localStorage.getItem('pages_pass');
    if (st === HASH) {
      const d = await decrypt(HASH);
      if (d) { content.innerHTML = d; if(gate) gate.classList.add('hidden'); return; }
    }
  })();
  window.checkPassword = async function() {
    const pwd = input ? input.value : '';
    const dg = await sha256(pwd);
    if (dg !== HASH) {
      if(error) { error.style.display='block'; setTimeout(()=>error.style.display='none',2000); }
      return;
    }
    const d = await decrypt(pwd);
    if (d) {
      content.innerHTML = d;
      if(gate) gate.classList.add('hidden');
      localStorage.setItem('pages_pass', dg);
      if(window.onContentDecrypted) window.onContentDecrypted();
    }
  };
  if(input) input.addEventListener('keydown', function(e){ if(e.key==='Enter') window.checkPassword(); });
})();
</script>
