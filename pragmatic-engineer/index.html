<head>

<title>The Pragmatic Engineer — Last 5 Issues · Research Artifact</title>
<style>
  /* ─── PASSWORD GATE ─── */
  #password-gate {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0f;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  #password-gate.hidden { display: none; }
  .gate-box { text-align: center; padding: 40px; max-width: 380px; }
  .gate-box h1 { font-size: 24px; font-weight: 700; color: #f0f0f0; margin-bottom: 8px; }
  .gate-box p { font-size: 14px; color: #888; margin-bottom: 24px; }
  .gate-box input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; color: #fff; font-size: 15px;
    outline: none; text-align: center;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
  }
  .gate-box input:focus { border-color: #60a5fa; }
  .gate-box .error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }
  .gate-box .error.show { display: block; }
  .gate-box .lock-icon { font-size: 40px; margin-bottom: 16px; }

  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ─── Nav ─── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; gap: 6px;
    padding: 10px 20px;
    background: rgba(10,10,15,0.85); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    overflow-x: auto; scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex-shrink: 0; padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 500; color: #888;
    text-decoration: none; transition: all 0.2s; white-space: nowrap;
  }
  nav a:hover, nav a.active { color: #fff; background: rgba(255,255,255,0.08); }
  nav .sep { color: #333; font-size: 11px; margin: 0 2px; }

  /* ─── Hero ─── */
  .hero {
    padding: 80px 24px 50px; text-align: center;
    background: linear-gradient(180deg, rgba(59,130,246,0.06) 0%, transparent 100%);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .hero h1 {
    font-size: clamp(26px,4.5vw,42px); font-weight: 800;
    background: linear-gradient(135deg,#60a5fa,#a78bfa,#f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p.sub { margin-top: 10px; font-size: 15px; color: #888; max-width: 600px; margin-inline: auto; }
  .hero .meta { margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .hero .meta span { font-size: 12px; color: #666; background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 20px; }

  /* ─── Sections ─── */
  section { padding: 40px 24px; max-width: 860px; margin: 0 auto; }
  section h2 {
    font-size: 20px; font-weight: 700; margin-bottom: 16px; color: #f0f0f0;
    display: flex; align-items: center; gap: 10px;
  }
  section h2 .badge {
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
    background: rgba(59,130,246,0.15); color: #60a5fa; white-space: nowrap;
  }
  section h3 { font-size: 16px; font-weight: 600; margin: 22px 0 10px; color: #ccc; }
  section p { font-size: 14px; color: #aaa; margin-bottom: 12px; }
  section p b, section p strong { color: #e0e0e0; font-weight: 600; }
  section ul { font-size: 14px; color: #999; padding-left: 18px; margin: 8px 0 14px; }
  section ul li { margin-bottom: 5px; }
  section blockquote {
    border-left: 3px solid rgba(59,130,246,0.3);
    padding: 10px 14px; margin: 12px 0; font-size: 13px; color: #bbb;
    background: rgba(59,130,246,0.04); border-radius: 0 8px 8px 0;
    font-style: italic;
  }

  /* ─── Article Cards ─── */
  .article-card {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 24px; margin: 20px 0;
  }
  .article-card:target { border-color: rgba(59,130,246,0.2); }
  .article-card .art-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .article-card .art-title { font-size: 17px; font-weight: 700; color: #f0f0f0; }
  .article-card .art-date { font-size: 12px; color: #666; white-space: nowrap; padding-top: 3px; }
  .article-card .art-link {
    display: inline-block; font-size: 12px; color: #60a5fa; text-decoration: none; margin-bottom: 12px;
  }
  .article-card .art-link:hover { text-decoration: underline; }

  /* Stat Grid */
  .stat-grid {
    display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
    gap: 10px; margin: 12px 0;
  }
  .stat-card {
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px; padding: 12px; text-align: center;
  }
  .stat-card .stat-num { font-size: 22px; font-weight: 700; color: #f0f0f0; }
  .stat-card .stat-label { font-size: 11px; color: #888; margin-top: 3px; }
  .stat-card.green { border-color: rgba(34,197,94,0.2); }
  .stat-card.green .stat-num { color: #4ade80; }
  .stat-card.red { border-color: rgba(239,68,68,0.2); }
  .stat-card.red .stat-num { color: #f87171; }
  .stat-card.blue { border-color: rgba(59,130,246,0.2); }
  .stat-card.blue .stat-num { color: #60a5fa; }
  .stat-card.purple { border-color: rgba(168,85,247,0.2); }
  .stat-card.purple .stat-num { color: #a78bfa; }

  /* Table */
  .data-table {
    width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0;
  }
  .data-table th {
    text-align: left; padding: 8px 10px; font-weight: 600; color: #888;
    border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .data-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #aaa; }
  .data-table tr:hover td { background: rgba(255,255,255,0.02); }

  /* Tags */
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
  .tag-trend { background: rgba(34,197,94,0.12); color: #4ade80; }
  .tag-warn { background: rgba(239,68,68,0.12); color: #f87171; }
  .tag-info { background: rgba(59,130,246,0.12); color: #60a5fa; }
  .tag-note { background: rgba(168,85,247,0.12); color: #a78bfa; }

  /* Footer */
  footer { text-align: center; padding: 28px 24px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 12px; color: #555; }
  footer a { color: #60a5fa; text-decoration: none; }

  @media (max-width:600px) {
    .stat-grid { grid-template-columns: repeat(2,1fr); }
    .data-table { font-size: 12px; }
    .data-table th, .data-table td { padding: 6px 8px; }
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  section { animation: fadeUp 0.4s ease-out; }
</style>

  const gate = document.getElementById('password-gate');
  const input = document.getElementById('password-input');
  const error = document.getElementById('password-error');
  const content = document.getElementById('protected-content');

  async function sha256(s) {
    const b = new TextEncoder().encode(s);
    const h = await crypto.subtle.digest('SHA-256', b);
    return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2,'0')).join('');
  }
  async function deriveKey(pwd, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd),
      {name:'PBKDF2'},false,['deriveBits','deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
  }
  async function decrypt(pwd) {
    try {
      const r = Uint8Array.from(atob(PAYLOAD), c=>c.charCodeAt(0));
      const s=r.slice(0,16), iv=r.slice(16,28), ct=r.slice(28);
      const k = await deriveKey(pwd, s);
      const d = await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
      return new TextDecoder().decode(d);
    } catch(e) { return null; }
  }
  (async()=>{
    const st = localStorage.getItem('pages_pass');
    if (st === HASH) {
      const d = await decrypt(HASH);
      if (d) { content.innerHTML = d; if(gate) gate.classList.add('hidden'); return; }
    }
  })();
  window.checkPassword = async function() {
    const pwd = input ? input.value : '';
    const dg = await sha256(pwd);
    if (dg !== HASH) {
      if(error) { error.style.display='block'; setTimeout(()=>error.style.display='none',2000); }
      return;
    }
    const d = await decrypt(pwd);
    if (d) {
      content.innerHTML = d;
      if(gate) gate.classList.add('hidden');
      localStorage.setItem('pages_pass', dg);
      if(window.onContentDecrypted) window.onContentDecrypted();
    }
  };
  if(input) input.addEventListener('keydown', function(e){ if(e.key==='Enter') window.checkPassword(); });
})();
