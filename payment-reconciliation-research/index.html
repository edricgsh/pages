<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Reconciliation Research — Market Map & Signals</title>
<link rel="stylesheet" href="/pages/_shared/menu.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a28;
    --surface3: #22223a;
    --border: #2a2a44;
    --text: #e4e4ed;
    --text2: #9898b8;
    --text3: #6868a0;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00b894;
    --green-bg: rgba(0,184,148,0.1);
    --red: #e17055;
    --red-bg: rgba(225,112,85,0.1);
    --orange: #fdcb6e;
    --orange-bg: rgba(253,203,110,0.1);
    --blue: #0984e3;
    --blue-bg: rgba(9,132,227,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Hero ── */
  .hero {
    padding: 80px 24px 60px;
    text-align: center;
    background: linear-gradient(180deg, rgba(108,92,231,0.08) 0%, transparent 100%);
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(108,92,231,0.03) 0%, transparent 60%);
    animation: pulse 8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .hero * { position: relative; z-index: 1; }
  .hero .tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 14px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .hero p {
    font-size: 18px;
    color: var(--text2);
    max-width: 640px;
    margin: 0 auto 24px;
  }
  .hero .subtitle {
    color: var(--text3);
    font-size: 14px;
  }
  .hero .subtitle strong { color: var(--text2); }

  /* ── Nav pills ── */
  .nav-pills {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-pills a {
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text2);
    text-decoration: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .nav-pills a:hover {
    color: var(--text);
    border-color: var(--accent);
    background: rgba(108,92,231,0.1);
  }

  /* ── Container ── */
  .container { max-width: 960px; margin: 0 auto; padding: 40px 20px; }

  /* ── Section ── */
  .section {
    margin-bottom: 60px;
  }
  .section-header {
    margin-bottom: 32px;
  }
  .section-header h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-header h2 .num {
    background: var(--accent);
    color: #fff;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }
  .section-header p { color: var(--text2); margin-top: 8px; font-size: 15px; }

  /* ── Problem Block ── */
  .problem-grid {
    display: grid;
    gap: 16px;
    margin-bottom: 32px;
  }
  .problem-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: border-color 0.2s;
    cursor: default;
  }
  .problem-card:hover { border-color: var(--accent); }
  .problem-card .label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .problem-card h3 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .problem-card p, .problem-card li {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
  }
  .problem-card ul { padding-left: 18px; }
  .problem-card li { margin-bottom: 4px; }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .tabs button {
    flex: 1;
    padding: 14px 20px;
    border: none;
    background: var(--surface);
    color: var(--text2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border-right: 1px solid var(--border);
  }
  .tabs button:last-child { border-right: none; }
  .tabs button.active { background: var(--accent); color: #fff; }
  .tabs button:hover:not(.active) { background: var(--surface2); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── Persona ── */
  .persona {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .persona-header {
    background: var(--accent);
    padding: 24px;
    color: #fff;
  }
  .persona-header h2 { font-size: 22px; font-weight: 700; }
  .persona-header .role { opacity: 0.85; font-size: 14px; margin-top: 4px; }
  .persona-body { padding: 24px; }
  .persona-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .persona-stat {
    background: var(--surface3);
    border-radius: var(--radius-sm);
    padding: 16px;
    text-align: center;
  }
  .persona-stat .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent2);
  }
  .persona-stat .lbl {
    font-size: 12px;
    color: var(--text3);
    margin-top: 4px;
  }
  .day-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .day-entry {
    display: flex;
    gap: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--border);
    transition: border-color 0.2s;
  }
  .day-entry:hover { border-left-color: var(--accent); }
  .day-entry .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--text3);
    min-width: 80px;
    padding-top: 2px;
  }
  .day-entry .desc {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }
  .day-entry .desc strong { color: var(--text); }

  /* ── Signal cards ── */
  .signal-list { display: grid; gap: 16px; }
  .signal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .signal-card:hover { border-color: var(--accent); }
  .signal-card.open { border-color: var(--accent); background: rgba(108,92,231,0.04); }
  .signal-card .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }
  .signal-card .top .left { flex: 1; }
  .signal-card .strength {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .signal-card .strength.strong { background: var(--green-bg); color: var(--green); }
  .signal-card .strength.medium { background: var(--orange-bg); color: var(--orange); }
  .signal-card .strength.signal { background: var(--blue-bg); color: var(--blue); }
  .signal-card h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .signal-card .preview {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.6;
  }
  .signal-card .expand-icon {
    font-size: 18px;
    color: var(--text3);
    transition: transform 0.3s;
    flex-shrink: 0;
    margin-top: 6px;
  }
  .signal-card.open .expand-icon { transform: rotate(180deg); }
  .signal-card .detail {
    display: none;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
  }
  .signal-card.open .detail { display: block; }

  /* ── Competitor Table ── */
  .comp-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
  }
  .comp-table th {
    background: var(--surface2);
    color: var(--text);
    font-weight: 600;
    padding: 12px 16px;
    text-align: left;
    border-bottom: 2px solid var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .comp-table td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
  }
  .comp-table tr:hover td { background: rgba(108,92,231,0.03); }
  .comp-table .company-name { font-weight: 600; color: var(--text); }
  .comp-table .gap-highlight { color: var(--green); font-size: 12px; }
  .comp-table .gap-warning { color: var(--orange); font-size: 12px; }

  /* ── Quote ── */
  .quote-block {
    background: var(--surface);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 20px 24px;
    margin: 20px 0;
  }
  .quote-block p {
    font-size: 15px;
    font-style: italic;
    color: var(--text);
    line-height: 1.7;
  }
  .quote-block .attr {
    font-size: 12px;
    color: var(--text3);
    margin-top: 8px;
    font-style: normal;
  }

  /* ── Communities ── */
  .comm-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }
  .comm-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    transition: border-color 0.2s;
  }
  .comm-card:hover { border-color: var(--accent); }
  .comm-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .comm-card .url { font-size: 12px; color: var(--accent2); word-break: break-all; }
  .comm-card p { font-size: 13px; color: var(--text3); margin-top: 6px; }

  /* ── CTA ── */
  .cta-box {
    background: linear-gradient(135deg, rgba(108,92,231,0.1) 0%, rgba(162,155,254,0.05) 100%);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    margin-top: 40px;
  }
  .cta-box h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .cta-box p { color: var(--text2); font-size: 14px; }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 32px;
    color: var(--text3);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .container { padding: 24px 16px; }
    .persona-stats { grid-template-columns: repeat(2, 1fr); }
    .day-entry { flex-direction: column; gap: 4px; }
    .day-entry .time { min-width: auto; }
    .comp-table { font-size: 12px; }
    .comp-table th, .comp-table td { padding: 10px 12px; }
    .tabs { flex-direction: column; }
    .tabs button { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>

  const gate = document.getElementById('password-gate');
  const input = document.getElementById('password-input');
  const error = document.getElementById('password-error');
  const content = document.getElementById('protected-content');

  async function sha256(str) {
    const buf = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  async function deriveKey(pwd, salt) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd),
      { name: 'PBKDF2' }, false, ['deriveBits', 'deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 600000, hash: 'SHA-256' },
      km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function decryptContent(pwd) {
    try {
      const raw = Uint8Array.from(atob(ENCRYPTED_PAYLOAD), c => c.charCodeAt(0));
      const salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      const key = await deriveKey(pwd, salt);
      const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
      return new TextDecoder().decode(dec);
    } catch(e) { return null; }
  }

  (async function() {
    const stored = localStorage.getItem('pages_pass');
    if (stored === PASSWORD_HASH) {
      const d = await decryptContent(PASSWORD_HASH);
      if (d) { content.innerHTML = d; if(gate) gate.classList.add('hidden'); return; }
    }
  })();

  window.checkPassword = async function() {
    const pwd = input ? input.value : '';
    const digest = await sha256(pwd);
    if (digest !== PASSWORD_HASH) {
      if (error) { error.style.display = 'block'; setTimeout(() => error.style.display = 'none', 2000); }
      return;
    }
    const d = await decryptContent(pwd);
    if (d) {
      content.innerHTML = d;
      if (gate) gate.classList.add('hidden');
      localStorage.setItem('pages_pass', digest);
      if (window.onContentDecrypted) window.onContentDecrypted();
    }
  };
  if (input) input.addEventListener('keydown', function(e){ if (e.key === 'Enter') window.checkPassword(); });
})();
